services:
  - type: web
    name: danisaev-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      gunicorn --workers 1 --threads 4 --bind "0.0.0.0:$PORT"
      --access-logformat '%(m)s %(U)s %(s)s %(L)ss' 'app:create_app()'
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
